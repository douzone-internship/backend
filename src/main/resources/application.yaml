spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id:
            client-secret:
            redirect-uri:
            scope:
              - profile
              - email
          kakao:
            client-id:
            client-secret:
            redirect-uri:
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  datasource:
    url:
    username:
    password:
    driver-class-name:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      max-lifetime: 600000
      idle-timeout: 300000
      connection-timeout: 20000
      keepalive-time: 120000
      validation-timeout: 5000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000

  application:
    name: backend

  profiles:
    active: local

  jpa:
    database-platform:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: false
  api-docs:
    path: /v3/api-docs
    enabled: false
  packages-to-scan: com.douzone_internship.backend.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

system-prompt:

user-prompt:

api-url:

api-key:

env:
  open-data-key:

  clinic-code-url:

  hospital-list-url:

  clinic-payment-url:

# 배포 환경 설정
app:
  base-url: ${APP_BASE_URL:https://elomadoc.duckdns.org}
  cors:
    # 콤마로 구분된 origin 목록 (예: https://a.com,https://b.com)
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://elomadoc.duckdns.org}

security:
  jwt:
    token:
      # 기본값을 두지 않아 환경변수 미설정 시 기동 실패하도록 함 (운영 보안)
      secret-key: ${JWT_SECRET_KEY}
      access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

server:
  forward-headers-strategy: native

# Resilience4j 설정
resilience4j:
  retry:
    instances:
      openDataApi:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.net.SocketTimeoutException
      geminiApi:
        max-attempts: 2
        wait-duration: 2s
        retry-exceptions:
          - java.io.IOException
          - com.google.genai.errors.ServerException
  circuitbreaker:
    instances:
      openDataApi:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      geminiApi:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2

observability:
  actuator-prometheus-public: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    defaults:
      enabled: true
