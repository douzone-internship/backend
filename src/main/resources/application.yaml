spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id:
            client-secret:
            redirect-uri:
            scope:
              - profile
              - email
          kakao:
            client-id:
            client-secret:
            redirect-uri:
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  datasource:
    url:
    username:
    password:
    driver-class-name:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      max-lifetime: 600000
      idle-timeout: 300000
      connection-timeout: 20000
      keepalive-time: 120000
      validation-timeout: 5000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000

  application:
    name: backend

  profiles:
    active: local

  jpa:
    database-platform:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 1000
          order_inserts: true
          order_updates: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: false
  api-docs:
    path: /v3/api-docs
    enabled: false
  packages-to-scan: com.douzone_internship.backend.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

system-prompt:

user-prompt:

api-url:

api-key:

env:
  open-data-key:

  clinic-code-url:

  hospital-list-url:

  clinic-payment-url:

# 배포 환경 설정
app:
  base-url: ${APP_BASE_URL:https://elomadoc.duckdns.org}
  cors:
    # 콤마로 구분된 origin 목록 (예: https://a.com,https://b.com)
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://elomadoc.duckdns.org}

security:
  jwt:
    token:
      # 기본값을 두지 않아 환경변수 미설정 시 기동 실패하도록 함 (운영 보안)
      secret-key: ${JWT_SECRET_KEY}
      access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

server:
  forward-headers-strategy: native
  tomcat:
    mbeanregistry:
      # 켜지 않으면 tomcat_threads_busy_threads / tomcat_threads_current_threads 가
      # 아예 수집되지 않는다(세션 메트릭만 나옴). 스레드풀 적체를 보려면 필수.
      enabled: true

# Resilience4j 설정
resilience4j:
  retry:
    instances:
      openDataApi:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - java.net.SocketTimeoutException
      geminiApi:
        max-attempts: 2
        wait-duration: 2s
        retry-exceptions:
          - java.io.IOException
          - com.google.genai.errors.ServerException
  circuitbreaker:
    instances:
      openDataApi:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      geminiApi:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2

observability:
  # /actuator/prometheus 를 인증 없이 열지 여부.
  # 운영에서는 management.server.port 를 8080과 분리하고(그 포트를 호스트에 publish하지 않음)
  # 이 값을 true로 둔다 → 공개 포트에는 actuator가 아예 없고, Prometheus는 도커 네트워크
  # 내부에서만 스크레이핑한다. 기본값 false는 "실수로 공개되는 일은 없다"를 보장하는 안전망.
  actuator-prometheus-public: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    defaults:
      enabled: true
  metrics:
    tags:
      # 여러 인스턴스를 한 Prometheus로 모을 때 구분하기 위한 공통 태그
      application: ${spring.application.name:backend}
    distribution:
      percentiles-histogram:
        # 켜지 않으면 http_server_requests_seconds_bucket 이 없어서
        # histogram_quantile()로 p95/p99를 구할 수 없다(_count/_sum/_max만 나옴).
        http.server.requests: true
      # 버킷 범위를 제한해 시계열 카디널리티 폭증을 막는다.
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 30s
