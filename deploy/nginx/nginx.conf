worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Grafana 로그인 브루트포스 완화
    limit_req_zone $binary_remote_addr zone=grafana_login:10m rate=5r/m;

    upstream app      { server app:8080; }
    upstream grafana  { server grafana:3000; }

    # ---------------------------------------------------------------
    # HTTP → HTTPS 리다이렉트 (ACME 챌린지만 평문 허용)
    # ---------------------------------------------------------------
    server {
        listen 80;
        server_name ${APP_DOMAIN} ${MONITORING_DOMAIN};

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------
    # 서비스 본체
    # ---------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name ${APP_DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${APP_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${APP_DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # actuator는 공개 도메인에서 절대 노출하지 않는다.
        # (관리 포트 분리로 app:8080에는 애초에 없지만, 설정이 되돌아가더라도
        #  엣지에서 한 번 더 막는 이중 방어다.)
        location /actuator {
            return 404;
        }

        location / {
            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;   # 리포트 API는 LLM 호출로 수십 초가 걸릴 수 있다
        }
    }

    # ---------------------------------------------------------------
    # 모니터링 (Grafana) — Basic Auth로 한 겹 더 감싼다
    # ---------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name ${MONITORING_DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${MONITORING_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${MONITORING_DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Grafana 자체 로그인 위에 nginx Basic Auth를 얹는다(2중).
        # .htpasswd 생성:  htpasswd -c deploy/nginx/.htpasswd <계정>
        auth_basic           "Elomadoc Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location /login {
            limit_req zone=grafana_login burst=5 nodelay;
            proxy_pass http://grafana;
            include /etc/nginx/proxy_common.conf;
        }

        location / {
            proxy_pass http://grafana;
            include /etc/nginx/proxy_common.conf;
        }

        # Grafana Live(웹소켓)
        location /api/live/ {
            proxy_pass http://grafana;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
        }
    }
}
