# 운영 배포 구성 (EC2).
#
# 보안 원칙: 호스트에 publish하는 포트는 nginx의 80/443 뿐이다.
#   - app:8080      → 도커 네트워크 내부 전용. 외부 접근은 전부 nginx를 거친다.
#   - app:9091      → actuator 전용 관리 포트. publish하지 않으므로 인터넷에서 도달 불가.
#                     (관리 포트를 분리하면 공개 포트 8080에는 /actuator/* 가 존재하지 않는다)
#   - prometheus    → publish 안 함. Prometheus는 자체 인증이 없으므로 절대 노출 금지.
#   - grafana       → publish 안 함. nginx가 TLS + Basic Auth로 감싼 뒤에만 노출.
#
# 필요한 .env.prod 항목:
#   PROD_CONFIG_DIR   application-prod.yaml이 들어있는 서버상의 디렉터리 경로
#   APP_DOMAIN, MONITORING_DOMAIN
#   JWT_SECRET_KEY, OPEN_DATA_KEY, GEMINI_API_KEY
#   GRAFANA_ADMIN_USER, GRAFANA_ADMIN_PASSWORD
# 사전 준비: deploy/nginx/.htpasswd 생성, TLS 인증서 최초 발급(certbot standalone).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
      - "9091"
    volumes:
      # 운영 설정(application-prod.yaml)은 레포에 두지 않고 서버의 디렉터리를 마운트한다.
      # DB 접속정보 / Gemini 키 / OpenData URL 등이 여기에 들어있다.
      # PROD_CONFIG_DIR은 그 yaml이 들어있는 "디렉터리" 경로다 (파일 경로가 아님).
      - ${PROD_CONFIG_DIR}:/app/config:ro
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 마운트한 디렉터리에서 application-prod.yaml을 추가로 읽는다.
      # 이미지 안에 패키징된 application.yaml보다 우선순위가 높아 빈 값들을 채운다.
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/
      # actuator를 공개 포트에서 분리한다. 이 포트는 publish하지 않는다.
      MANAGEMENT_SERVER_PORT: 9091
      # 관리 포트가 인터넷에 노출되지 않으므로 Prometheus가 인증 없이 스크레이핑해도 안전하다.
      # (기본값 false는 실수로 8080에 노출되는 사고를 막는 안전망)
      OBSERVABILITY_ACTUATOR_PROMETHEUS_PUBLIC: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      OPEN_DATA_KEY: ${OPEN_DATA_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      APP_BASE_URL: https://${APP_DOMAIN}
      APP_CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    # 운영에서는 remote-write receiver를 켜지 않는다(로드테스트 전용).
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.listen-address=0.0.0.0:9090'
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # nginx 서브도메인 뒤에 있으므로 외부 URL을 알려준다
      GF_SERVER_ROOT_URL: https://${MONITORING_DOMAIN}
      GF_SERVER_ENFORCE_DOMAIN: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # UI에서 만든 대시보드/설정이 재시작에도 남도록 데이터 볼륨을 붙인다
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - prometheus

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      MONITORING_DOMAIN: ${MONITORING_DOMAIN}
    # nginx.conf의 ${APP_DOMAIN} 치환을 위해 templates 메커니즘 사용
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./deploy/nginx/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
      - ./deploy/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    command: >
      /bin/sh -c "envsubst '$$APP_DOMAIN $$MONITORING_DOMAIN'
      < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - app
      - grafana

  # 인증서 자동 갱신 (12시간마다 확인, 만료 30일 전부터 실제 갱신)
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"

volumes:
  prometheus-data:
  grafana-data:
