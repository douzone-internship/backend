apiVersion: 1
providers:
  - name: 'elomadoc'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # deploy/grafana/dashboards 를 마운트한다 (운영과 동일한 대시보드)
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
